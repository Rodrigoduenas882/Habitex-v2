name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

# Read-only by default - this workflow only verifies code, it never deploys,
# comments, or writes anything back to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pinned to the exact version package.json's "packageManager" field
      # already declares, so CI never silently drifts from local dev.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile: fails the build instead of silently updating
      # pnpm-lock.yaml if it's ever out of sync with package.json.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # No Supabase secrets required: vite.config.ts already stubs
      # VITE_SUPABASE_URL/VITE_SUPABASE_PUBLISHABLE_KEY with non-functional
      # placeholders for the test environment - no network calls happen
      # against them.
      - name: Unit tests
        run: pnpm test

      # vite build does not execute src/shared/lib/env.ts's runtime Zod
      # validation (that only runs in the browser) - a production build
      # succeeds without any real Supabase env vars present, verified
      # locally against this exact workflow before committing.
      - name: Build
        run: pnpm build
