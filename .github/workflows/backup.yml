name: Backup

# INC-BKP-004 - prepares automation for the backup pipeline validated
# locally across INC-BKP-001 through INC-BKP-003 (backup_reader role,
# PostgreSQL export, Storage export, R2 upload/verify orchestration). This
# workflow is NOT active: both triggers below require a human action
# before any real backup runs - see the two gates documented inline.
#
# Gate 1 (this trigger definition): the scheduled trigger is commented out
# entirely, not merely disabled by a condition - GitHub Actions only runs
# `schedule:` crons from the repository's default branch, and only once a
# workflow file defining one has been merged there. This file is not even
# committed yet (restriction: "no hacer commit, push ni merge"), so there
# is zero risk of this cron ever firing from today's state. When a human
# approves enabling the schedule, uncomment the block below - do not add a
# new one, so this comment and the review history around it stay attached
# to the trigger that was actually reasoned about.
#
# on:
#   schedule:
#     - cron: '0 9 * * *'   # proposed: daily 09:00 UTC - human-approved, not active

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN to confirm you intend to execute a real backup against production'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: backup-${{ github.workflow }}
  cancel-in-progress: false # never cancel a backup mid-upload

jobs:
  backup:
    name: Run backup (PostgreSQL + Storage -> R2)
    runs-on: ubuntu-latest
    # Gate 0: this workflow only has one trigger, `workflow_dispatch` - but
    # that trigger does NOT restrict which ref a dispatch runs against (the
    # GitHub UI/API lets anyone with Actions write-access pick any branch or
    # tag that has this file, not only the default branch). Without this
    # check, a deliberate dispatch against a branch carrying modified
    # scripts/backup/ code would still receive the real production secrets
    # below - a workflow_dispatch's own branch-selection isn't itself a
    # security boundary. This job-level `if:` is evaluated BEFORE any step
    # runs, including Checkout - a dispatch against any ref other than
    # `refs/heads/main` skips this job entirely (shows as "skipped", not
    # "failed"): no checkout, no secret ever gets referenced/resolved, no
    # external network call of any kind happens. This is strictly additive
    # to Gate 1/Gate 2 below (confirm=RUN + BACKUP_AUTOMATION_ENABLED) -
    # all three are required (AND), none replaces another.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Gate 2: the kill switch. Even a manual workflow_dispatch run (the
      # only trigger that exists right now) does nothing real past this
      # point unless a human has explicitly set the BACKUP_AUTOMATION_ENABLED
      # repository variable to exactly "true" AND typed "RUN" into the
      # confirm input above. Both conditions are required (AND, not OR) -
      # neither one alone is enough to make this workflow do real work.
      - name: Guard - confirm this run is intentional and automation is enabled
        run: |
          if [ "${{ inputs.confirm }}" != "RUN" ]; then
            echo "confirm input was not exactly 'RUN' - stopping, no backup executed." >&2
            exit 1
          fi
          if [ "${{ vars.BACKUP_AUTOMATION_ENABLED }}" != "true" ]; then
            echo "BACKUP_AUTOMATION_ENABLED repository variable is not 'true' - stopping, no backup executed." >&2
            echo "This is the explicit human approval gate - see docs/ops/backup-automation-findings.md." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # age is not preinstalled on GitHub-hosted Ubuntu runners.
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age

      # pg_dump - already-validated export-postgres-data.sh (INC-BKP-002)
      # needs it on PATH, same as any Linux environment (unlike this
      # repo's own Windows dev machine, which required a local Docker
      # escape hatch - not needed here, the runner is Linux).
      #
      # INC-BKP-006 fix: `sudo apt-get install -y postgresql-client` (the
      # version this step used before) pulls whatever major version Ubuntu
      # noble ships - PostgreSQL 16, confirmed against the ubuntu-24.04
      # runner image. The remote project runs PostgreSQL 17.6 (confirmed
      # via `select version()` against the project, read-only). A pg_dump
      # built against an *older* major version than the server refuses to
      # run at all ("server version mismatch"), per pg_dump's own
      # documented version-compatibility rule - pg_dump only supports
      # servers from its own version back to roughly 9.2, never a NEWER
      # server. This adds the official PGDG apt repo (apt.postgresql.org)
      # to install `postgresql-client-17` specifically, matching
      # `supabase/config.toml`'s `[db] major_version = 17`, then verifies
      # the installed pg_dump actually reports major version 17 - failing
      # the job immediately with a clear message rather than letting a
      # future Ubuntu image bump silently reintroduce this exact mismatch.
      #
      # Real-world follow-up fix: Backup run #1 (the first real production
      # run) still failed this exact guard, with `pg_dump --version`
      # reporting 16.15 despite this step completing with no error.
      # Verified (packages.debian.org's own file listing for
      # postgresql-client-17): the PGDG package installs its binaries
      # ONLY under /usr/lib/postgresql/17/bin/ - never at /usr/bin/pg_dump
      # directly. The ubuntu-24.04 runner image ships postgresql-client-16
      # preinstalled, and /usr/bin/pg_dump belongs to THAT package (or the
      # wrapper it configures) - installing postgresql-client-17 alongside
      # it does not retarget /usr/bin/pg_dump to the new version. Every
      # bare `pg_dump`/`psql` call in this job (including inside
      # scripts/backup/export-postgres-data.sh, invoked indirectly by
      # `node scripts/backup/run-backup.mjs` below) resolves through PATH,
      # so the fix is to prepend the versioned directory to $GITHUB_PATH
      # right here - this is picked up by every subsequent step in this
      # job (GitHub Actions' own documented mechanism for a job-wide PATH
      # change), including the "Run backup" step's child processes,
      # without touching any script logic.
      - name: Install PostgreSQL 17 client (pinned via PGDG, matches server major version)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      # Regression guard for the real Backup #1 failure: checking only the
      # version STRING (as this step did before) isn't enough - it already
      # passed locally against a correctly-configured machine and still
      # failed for real here, because the string check never asked *which
      # binary* produced it. Asserting the resolved path explicitly is
      # what actually catches "the wrong pg_dump is on PATH" as its own
      # distinct failure, with a message that names the real cause instead
      # of a bare version mismatch.
      - name: Verify pg_dump is major version 17 (fails fast on a future runner-image drift)
        run: |
          resolved_path="$(command -v pg_dump)"
          echo "pg_dump resolved to: $resolved_path"
          if [ "$resolved_path" != "/usr/lib/postgresql/17/bin/pg_dump" ]; then
            echo "pg_dump on PATH is not /usr/lib/postgresql/17/bin/pg_dump (got: $resolved_path) - this is the exact failure mode from Backup run #1: the ubuntu-24.04 runner's preinstalled postgresql-client-16 still owns /usr/bin/pg_dump, and \$GITHUB_PATH wasn't (or is no longer) pointing at the versioned PGDG install first. See docs/ops/remote-connectivity-and-pgdump-findings.md." >&2
            exit 1
          fi
          version_line="$(pg_dump --version)"
          echo "$version_line"
          if ! echo "$version_line" | grep -qE '\) 17\.'; then
            echo "pg_dump is not major version 17 (got: $version_line) - the remote project runs PostgreSQL 17.6, and pg_dump cannot dump from a newer server than itself. See docs/ops/remote-connectivity-and-pgdump-findings.md (INC-BKP-006)." >&2
            exit 1
          fi

      # INC-BKP-006: this runner is IPv4-only (unlike a direct Supabase
      # connection, which defaults to IPv6-only), so BACKUP_PGHOST/PGPORT
      # must be the Supavisor SESSION MODE pooler (port 5432 - never 6543
      # transaction mode, which pg_dump cannot use), and BACKUP_PGUSER must
      # be "backup_reader.<project-ref>" (the shared-pooler username
      # format), not bare "backup_reader". See
      # docs/ops/remote-connectivity-and-pgdump-findings.md and
      # docs/ops/activation-runbook.md §6. scripts/backup's own
      # shared/pg-connection-guard.mjs fails fast with a clear error if
      # PGUSER doesn't match this shape for a pooler PGHOST.
      - name: Run backup
        env:
          PGHOST: ${{ secrets.BACKUP_PGHOST }}
          PGPORT: ${{ secrets.BACKUP_PGPORT }}
          PGDATABASE: ${{ secrets.BACKUP_PGDATABASE }}
          PGUSER: ${{ secrets.BACKUP_PGUSER }}
          PGPASSWORD: ${{ secrets.BACKUP_PGPASSWORD }}
          SUPABASE_URL: ${{ secrets.BACKUP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BACKUP_SUPABASE_SERVICE_ROLE_KEY }}
          AGE_RECIPIENTS: ${{ secrets.BACKUP_AGE_RECIPIENTS }}
          R2_ENDPOINT: ${{ secrets.BACKUP_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
          HEALTHCHECKS_PING_URL: ${{ secrets.BACKUP_HEALTHCHECKS_PING_URL }}
        run: node scripts/backup/run-backup.mjs
