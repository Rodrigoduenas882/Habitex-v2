<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habitex</title>
    <script>
      // Applies the persisted/system theme before paint to avoid a flash of
      // the wrong theme. Keep the storage key in sync with theme.ts.
      ;(function () {
        try {
          var stored = window.localStorage.getItem('habitex:theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (error) {
          // Ignore - the app falls back to the default theme.
        }
      })()
    </script>
    <style>
      /* Belt-and-suspenders against a background flash (not just the wrong
         theme's text/borders) on first paint - `data-theme` is already set
         by the script above by the time this is evaluated, but the real
         stylesheet (tokens.css) is only guaranteed to be loaded/applied
         *after* this point (in dev especially, where Vite injects CSS via
         JS instead of a blocking <link>). Values below are copied from
         tokens.css's --color-background - keep them in sync if that ever
         changes; they're the only colors in the app allowed to be
         hardcoded outside a token, precisely because they must render
         before any CSS file has had a chance to load. */
      html[data-theme='dark'] body {
        background: #121514;
      }
      html:not([data-theme='dark']) body {
        background: #f7f6f2;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
